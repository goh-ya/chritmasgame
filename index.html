<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one hand-drawn stage. Hero introduces the five players on thin ground lines; the playground reuses the same cast, gifts fly between slots, captions write themselves above. */
:root{--bg:#F2F0ED;--ink:#242424;--mute:#777777;--sub:#5c5c5c;--line:#D8D6D2;--yellow:#F3D46B;
--ease:cubic-bezier(.76,0,.24,1);
--hand:"Cactus Classical Serif","Gochi Hand","Kaiti TC","STKaiti",cursive;
--en:"Gochi Hand","Cactus Classical Serif","Kaiti TC",cursive;
--sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
--gs:clamp(40px,6vw,60px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 7px var(--yellow);border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{border-bottom:1px solid var(--line)}
.top .in{white-space:nowrap;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;font-family:var(--en);letter-spacing:.08em}
.top a{color:inherit;text-decoration:none}
.top a:hover{text-decoration:underline wavy var(--yellow) 2px;text-underline-offset:5px}

/* hero */
.hero{padding-block:clamp(22px,4.5vw,48px) 20px;text-align:center}
.eyebrow{font-family:var(--en);letter-spacing:.16em;font-size:clamp(14px,2vw,18px);color:var(--sub);margin:0}
.ttl{display:block;width:min(780px,96%);height:auto;margin:6px auto 0;overflow:visible}
.ttl text{font-family:var(--hand);fill:var(--ink);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:4000;animation:draw 2.4s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:4000;fill-opacity:0}55%{fill-opacity:0}to{stroke-dashoffset:0;fill-opacity:1}}
.ensub{font-family:var(--en);font-size:clamp(20px,3.6vw,36px);letter-spacing:.08em;margin:2px 0 0;animation:fade .8s 1.6s both}
.lede{color:var(--sub);max-width:34em;margin:10px auto 0;font-size:clamp(14px,1.8vw,17px);animation:fade .8s 1.8s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cast grid */
.cast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:clamp(4px,1.8vw,30px);align-items:end}
.cast { transform: scale(0.8); }
.hero .cast{margin-top:clamp(18px,3vw,36px)}
.char{position:relative;min-width:0}
.fig{position:relative;width:100%;max-width:200px;margin:0 auto;aspect-ratio:140/220;transition:opacity .4s}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lab{width:fit-content;margin-inline:auto;font-family:var(--hand);text-align:center;padding-inline:6px;font-size:clamp(14px,1.9vw,14px);margin-top:6px;letter-spacing:.06em;transition:all .3s}
.char.active .lab{-webkit-text-stroke:.7px var(--ink);background:linear-gradient(transparent 62%,var(--yellow) 62% 92%,transparent 92%)}
.hero .char{cursor:pointer;animation:rise .9s var(--ease) both}
.hero .char:nth-child(1){animation-delay:1.0s}.hero .char:nth-child(2){animation-delay:1.14s}.hero .char:nth-child(3){animation-delay:1.28s}.hero .char:nth-child(4){animation-delay:1.42s}.hero .char:nth-child(5){animation-delay:1.56s}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
.hg{position:absolute;right:-1%;bottom:3%;width:var(--gs);height:var(--gs);animation:wob 2.8s ease-in-out infinite;transform-origin:50% 100%}
.hg svg{width:100%;height:100%;overflow:visible}
.char:nth-child(2) .hg{animation-delay:-.7s}.char:nth-child(3) .hg{animation-delay:-1.4s}.char:nth-child(4) .hg{animation-delay:-2.1s}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.cue{display:inline-block;margin-top:26px;font-family:var(--en);letter-spacing:.16em;font-size:16px;color:var(--ink);text-decoration:none;animation:fade .8s 2.2s both}
.cue span{display:inline-block;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

/* character svg */
.ink{fill:var(--bg);stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.solid{fill:var(--ink);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.face{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.face .w{fill:var(--bg)}
.face text{font-family:var(--en);fill:var(--ink);stroke:none;font-size:16px}
.face .m{display:none}
svg[data-mood=idle] .m-idle,svg[data-mood=active] .m-active,svg[data-mood=happy] .m-happy,svg[data-mood=shocked] .m-shocked,svg[data-mood=sad] .m-sad,svg[data-mood=excited] .m-excited,svg[data-mood=smug] .m-smug,svg[data-mood=confused] .m-confused,svg[data-mood=sly] .m-sly,svg[data-mood=wry] .m-wry{display:inline}
.halo{fill:var(--yellow);fill-opacity:.0;stroke:var(--yellow);stroke-width:7;stroke-linecap:round;opacity:0;transition:opacity .35s;transform-origin:70px 110px}
.char.active .halo{opacity:1;fill-opacity:.32;animation:halo 2.4s ease-in-out infinite alternate}
@keyframes halo{from{transform:rotate(-3deg) scale(.97)}to{transform:rotate(3deg) scale(1.03)}}
.char.cand .halo{opacity:1;fill-opacity:0;stroke-width:5;stroke-dasharray:12 10}
.bw{transform-origin:70px 206px;animation:idle 4s ease-in-out infinite alternate}
.char:nth-child(2) .bw{animation-duration:3.4s}.char:nth-child(3) .bw{animation-duration:4.6s}.char:nth-child(4) .bw{animation-duration:3.8s}.char:nth-child(5) .bw{animation-duration:3s}
@keyframes idle{from{transform:rotate(-1.1deg)}to{transform:rotate(1.3deg) translateY(-1px)}}
.char.active .bw{animation:hop 1s var(--ease) infinite}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-9px) scale(.98,1.03)}60%{transform:translateY(-9px)}85%{transform:scale(1.03,.96)}}
.arm{transform-origin:0 0;transition:transform .35s var(--ease)}
.head{transition:transform .35s var(--ease)}
.hero .char[data-id=A]:hover .head,.hero .char[data-id=A]:focus-visible .head{animation:look 1.3s ease-in-out infinite}
@keyframes look{0%,100%{transform:none}25%{transform:translateX(-6px) rotate(-5deg)}75%{transform:translateX(6px) rotate(5deg)}}
.hero .char[data-id=C]:hover .head,.hero .char[data-id=C]:focus-visible .head{transform:rotate(-11deg)}
.hero .char[data-id=D]:hover .arm.r,.hero .char[data-id=D]:focus-visible .arm.r{transform:rotate(-68deg)}
.hero .char[data-id=E]:hover .bw,.hero .char[data-id=E]:focus-visible .bw{animation:hop .6s var(--ease) infinite}
.note{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:max-content;max-width:150%;font-family:var(--hand);font-size:clamp(11px,1.5vw,14px);text-align:center;color:var(--ink);background:var(--bg);padding:1px 6px;opacity:0;transition:opacity .4s;z-index:5;line-height:1.35}
.note.on{opacity:1}
.char.dim svg{opacity:.3}
.slot{position:absolute;right:-2%;bottom:3%;width:var(--gs);height:var(--gs);pointer-events:none}

/* playground */
.play{padding-block:clamp(36px,6vw,72px) 40px;border-top:1px solid var(--line);scroll-margin-top:0}
.cap{text-align:center;min-height:clamp(190px,26vw,236px);display:flex;flex-direction:column;align-items:center;gap:8px}
.scn{font-family:var(--en);letter-spacing:.2em;font-size:14px;color:var(--mute);margin:0}
.cap h2{font-family:var(--hand);font-weight:400;font-size:clamp(28px,5.4vw,58px);line-height:1.18;margin:0;text-wrap:balance}
.cap h2.wr{animation:wr .8s var(--ease) both}
@keyframes wr{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.sub{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(15px,2vw,19px);margin:0;max-width:40em;text-wrap:balance}
.sub svg{flex:none;width:34px;height:34px;animation:bob 1.4s ease-in-out infinite}
.rule{font-size:13px;color:var(--sub);margin:0;max-width:44em}
.rule b{font-family:var(--en);font-weight:400;letter-spacing:.14em;margin-right:6px;background:linear-gradient(transparent 60%,var(--line) 60%)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.btn{font-family:var(--en);font-size:clamp(16px,2.2vw,20px);letter-spacing:.08em;border:1.8px solid var(--ink);background:transparent;padding:8px 22px;min-height:46px;border-radius:999px;cursor:pointer;transition:transform .25s var(--ease),background .25s}
.btn:hover:not(:disabled){transform:translateY(-2px) rotate(-1deg)}
.btn.y{background:var(--yellow)}
.btn.pulse:not(:disabled){animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(243,212,107,.55)}}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sel{background:var(--yellow)}
.hud{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-family:var(--en);letter-spacing:.1em;font-size:14px;color:var(--sub);margin-top:6px;min-height:22px}
.hud i{width:11px;height:11px;border:1.6px solid var(--ink);border-radius:50%;display:inline-block}
.hud i.on{background:var(--yellow)}
.stage{position:relative;margin-top:6px}
.stage .cast{padding-top:18px}
.tray{margin-top:clamp(0px,4vw,40px);border-top:1.5px dashed var(--line);padding-top:8px}
.tray h3{font-family:var(--en);font-weight:400;letter-spacing:.2em;font-size:14px;color:var(--mute);margin:0 0 8px;text-align:center}
.tslots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:clamp(4px,1.8vw,30px)}
.tslot{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--en);font-size:13px;letter-spacing:.08em;color:var(--sub)}
.tslot .pad{width:calc(var(--gs) + 18px);height:calc(var(--gs) + 18px);border:1.6px dashed var(--line);border-radius:48% 52% 46% 54%/52% 46% 54% 48%;display:grid;place-items:center}
.tslot .pad i{width:var(--gs);height:var(--gs);display:block}
#layer,#fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
#layer{z-index:4}#fx{z-index:7}

/* gifts */
.gift{position:absolute;left:0;top:0;width:var(--gs);height:var(--gs);padding:0;margin:0;border:0;background:none;pointer-events:none;will-change:transform}
.gift .gi{position:relative;display:block;width:100%;height:100%}
.gift svg.gs{width:100%;height:100%;overflow:visible;display:block}
.gift .gs .ink{stroke-width:2.8}
.gift::before{content:"";position:absolute;inset:-9px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;opacity:0;transition:opacity .3s;pointer-events:none}
.gift.target{pointer-events:auto;cursor:pointer}
.gift.target::before{opacity:1;border:3px solid var(--yellow);background:rgba(243,212,107,.22)}
.gift.target .gi{animation:nudge 1.6s ease-in-out infinite}
.gift.target:hover .gi,.gift.target:focus-visible .gi{animation:wiggle .35s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.gift.locked::before{opacity:.6;background:var(--yellow);border:0}
.gift .lk{position:absolute;right:-13px;top:-15px;width:28px;height:28px;transform:scale(0);transition:transform .5s cubic-bezier(.34,1.9,.5,1)}
.gift.locked .lk{transform:scale(1) rotate(8deg)}
.gift .lt{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--en);font-size:12px;letter-spacing:.1em;white-space:nowrap;display:none}
.gift.locked .lt{display:block}
.gift .pips{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);display:none;gap:4px}
.gift.owned .pips{display:flex}.gift.locked.owned .pips{display:none}
.gift .pips i{width:8px;height:8px;border:1.5px solid var(--ink);border-radius:50%}
.gift .pips i.on{background:var(--yellow)}
.gift .num{position:absolute;left:-5px;top:-8px;font-family:var(--en);font-size:12px;color:var(--sub)}
.gift .lid{transition:transform .55s cubic-bezier(.34,1.6,.5,1);transform-box:fill-box;transform-origin:20% 100%}
.gift.open .lid{transform:translateY(-15px) rotate(-18deg)}
.gift .q{opacity:0;font-family:var(--en);font-size:24px;fill:var(--ink);transition:opacity .3s .2s}
.gift.open .q{opacity:1}
.shout{position:absolute;transform:translate(-50%,-50%);font-family:var(--en);font-size:clamp(32px,7vw,70px);line-height:1;white-space:nowrap;letter-spacing:.04em;isolation:isolate;pointer-events:none}
.shout::after{content:"";position:absolute;left:-5%;right:-5%;bottom:.02em;height:.36em;background:var(--yellow);z-index:-1;transform:rotate(-1.5deg)}
.star{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none}

/* controls */
.ctl{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,28px);margin-top:clamp(20px,5vw,48px);flex-wrap:wrap; margin-bottom: 8px;}
.pg{font-family:var(--en);font-size:clamp(22px,3vw,30px);letter-spacing:.12em;min-width:5.5em;text-align:center}
.restart{background:none;border:0;font-family:var(--en);letter-spacing:.12em;font-size:15px;color:var(--sub);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px;padding:10px 8px;min-height:44px}
.restart:hover{text-decoration-color:var(--ink)}
.endq{position:relative;display:inline-block;font-family:var(--en);font-size:clamp(44px,11vw,112px);line-height:1.1;letter-spacing:.04em}
.endq svg{position:absolute;left:-4%;top:30%;width:108%;height:40%;overflow:visible}
.endq path{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;transition:stroke-dashoffset .7s var(--ease)}
.endq.cut path{stroke-dashoffset:0}
.hl{background:linear-gradient(transparent 62%,var(--yellow) 62% 94%,transparent 94%)}
.foot{border-top:1px solid var(--line);padding-block:22px 34px;font-size:12px;color:var(--sub)}
.foot .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px}
@media (max-width:700px){
 .cast,.tslots{grid-template-columns:repeat(6,minmax(0,1fr))}
 .cast{row-gap:20px}
 .cast>.char{grid-column:span 2}.cast>.char:nth-child(4){grid-column:2/span 2}.cast>.char:nth-child(5){grid-column:4/span 2}
 .tslots{row-gap:14px}.tslot{grid-column:span 2}.tslot:nth-child(4){grid-column:2/span 2}.tslot:nth-child(5){grid-column:4/span 2}
 .btn{padding:8px 16px}
 .cap{min-height:230px}
 .cast { transform: scale(0.8); }
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<script>
const INK='#242424',IDS=['A','B','C','D','E'];
const NAMES={A:'緊張的小傢伙',B:'得意的傢伙',C:'呆萌的傢伙',D:'狡猾的傢伙',E:'貪心的小傢伙'};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- faces ---------- */
function face(o){
  const {x,y,s,g,m,r,ring}=o, sw=(2.8/s).toFixed(2);
  const dot=(cx,rr=r)=>`<circle cx="${cx}" cy="0" r="${rr}" fill="${INK}" stroke="none"/>`;
  const rg=(cx,rr)=>`<circle cx="${cx}" cy="0" r="${rr}" class="w"/><circle cx="${cx+1}" cy="1" r="${rr*.42}" fill="${INK}" stroke="none"/>`;
  const eyes=ring?rg(-g,5.5)+rg(g,5.5):dot(-g)+dot(g);
  const big=ring?rg(-g,6.4)+rg(g,6.4):dot(-g,r+1)+dot(g,r+1);
  const arc=cx=>`<path d="M${cx-5} 2 Q${cx} -6 ${cx+5} 2"/>`;
  const M={
   idle:`${eyes}<path d="M-5 ${m} Q0 ${m+2} 5 ${m}"/>`,
   active:`${big}<path d="M-6 ${m} Q0 ${m+5} 6 ${m}"/>`,
   happy:`${arc(-g)}${arc(g)}<path d="M-9 ${m-1} Q0 ${m+10} 9 ${m-1}"/>`,
   shocked:`<circle cx="${-g}" cy="0" r="${r+3.6}" class="w"/><circle cx="${g}" cy="0" r="${r+3.6}" class="w"/><circle cx="${-g}" cy="0" r="1.6" fill="${INK}" stroke="none"/><circle cx="${g}" cy="0" r="1.6" fill="${INK}" stroke="none"/><ellipse cx="0" cy="${m+3}" rx="4" ry="6" class="w"/><path d="M${-g-12} -11 l-5 -4 M${g+12} -11 l5 -4 M0 -17 v-6"/>`,
   sad:`${eyes}<path d="M${-g-6} -7 L${-g+4} -11 M${g-4} -11 L${g+6} -7"/><path d="M-7 ${m+4} Q0 ${m-4} 7 ${m+4}"/><path d="M${g+3} 6 q-3 6 0 8 q3 -2 0 -8" fill="${INK}"/>`,
   excited:`${arc(-g)}${arc(g)}<path d="M-9 ${m-2} Q0 ${m+16} 9 ${m-2}Z" fill="${INK}"/><path d="M${g+12} -10 l3 -5 M${-g-12} -10 l-3 -5"/>`,
   smug:`${eyes}<path d="M${-g-6} -2 H${-g+6} M${g-6} -2 H${g+6}" stroke-width="${(3.4/s).toFixed(2)}"/><path d="M-8 ${m} Q3 ${m+7} 9 ${m-4}"/>`,
   confused:`<circle cx="${-g}" cy="0" r="${r+2.4}" class="w"/><circle cx="${-g}" cy="0" r="1.8" fill="${INK}" stroke="none"/><circle cx="${g}" cy="1" r="${r-.8}" fill="${INK}" stroke="none"/><path d="M-7 ${m+1} q3.5 -4 7 0 t7 0"/><text x="${g+7}" y="-10" font-size="${(18/s).toFixed(1)}">?</text>`,
   sly:`<path d="M${-g-5} 0 L${-g+5} -2"/><path d="M${g-5} -2 L${g+5} 0"/>${dot(-g+3,1.8)}${dot(g+3,1.8)}<path d="M-6 ${m+1} Q2 ${m+7} 9 ${m-3}"/>`,

const VIC={A:'shocked',C:'confused',D:'shocked'},THI={B:'smug',D:'sly',E:'excited'};
async function doPick(d){
  busy=true;sync();const el=gEl(d.g),p=d.p;
  arm(p,'r',-62);await fly(el,slotC(p),800,90);
  S.owner[d.g]=p;S.round=0;arm(p,'r',0);mood(p,'happy');react(p,'jump');renderGift(d.g);
  await sleep(500);finish(d.a);
}
async function doSteal(d){
  busy=true;sync();const {th,vi,g}=d,el=gEl(g),side=IDS.indexOf(vi)>IDS.indexOf(th)?'r':'l';
  arm(th,side,side==='r'?-88:88);mood(th,'sly');await sleep(380);
  const a=slotC(vi),b=slotC(th);
  speedLines(a,b);shout('STEAL!',{x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-90});
  mood(vi,VIC[vi]);react(vi,'shake');
  await fly(el,b,750,70);
  S.owner[g]=th;S.steals[g]++;S.lost[vi].push(g);S.robbed[vi]=true;S.round++;
  mood(th,THI[th]);react(th,'jump');renderGift(g);renderHud();arm(th,side,0);
  if(S.steals[g]>=2){
    S.locked[g]=true;setCap(d.a);await sleep(450);await lockAnim(g,th);
  }else{setCap(d.a);await sleep(700)}
  if(vi!=='C')mood(vi,'sad');
  finish();
}
async function lockAnim(g,th){
  const el=gEl(g),c=el._p;el.classList.add('locked');
  const ring=addFx('<svg viewBox="0 0 112 112" width="112" height="112"><path d="M56 8 C86 6 104 28 102 56 C100 86 76 104 52 102 C24 100 8 78 10 52 C12 26 30 10 56 8Z" fill="none" stroke="#242424" stroke-width="3" stroke-dasharray="10 14" stroke-linecap="round"/></svg>',c.x,c.y,'margin:-56px 0 0 -56px');
  if(!RM){
    ring.animate([{transform:'rotate(0) scale(.5)',opacity:0},{opacity:1,offset:.25},{transform:'rotate(300deg) scale(1.15)',opacity:0}],{duration:1100,easing:'ease-out',fill:'forwards'});
    $('.gi',el).animate([{transform:'none'},{transform:'translateX(-4px) rotate(-6deg)'},{transform:'translateX(4px) rotate(6deg)'},{transform:'translateX(-3px) rotate(-4deg)'},{transform:'translateX(3px) rotate(4deg)'},{transform:'none'}],{duration:520});
  }
  shout('LOCKED!',{x:c.x,y:c.y-96});
  arm(th,'l',-68);arm(th,'r',68);mood(th,'excited');react(th,'jump');
  await sleep(1300);setTimeout(()=>ring.remove(),1200);
}
function setupSwap(){
  const cands=IDS.filter(p=>p!=='A'&&giftOf(p)&&!S.locked[giftOf(p)]&&!S.lost.A.includes(giftOf(p)));
  IDS.slice(1).forEach(p=>{
    if(cands.includes(p))cls(p,'cand',true);
    else{cls(p,'dim',true);note(p,S.locked[giftOf(p)]?'已鎖定，不能交換':'不能換回曾被搶走的禮物')}
  });
  const f=$('#cast .char[data-id="A"] .fig').getBoundingClientRect(),s=stage.getBoundingClientRect();
  setTimeout(()=>{if(N===9)shout('FINAL SWAP!',{x:Math.min(f.left-s.left+f.width/2+10,s.width-110),y:Math.max(f.top-s.top-6,20)},{keep:true,scale:.62})},T(300));
  button('KEEP MY GIFT',()=>doSwap(null)).dataset.lock='';
  cands.forEach(p=>{button('SWAP WITH '+p,()=>doSwap(p)).dataset.lock=''});
  sync();
}
async function doSwap(t){
  busy=true;sync();
  const bs=$$('#acts .btn');
  if(!t){
    bs[0].classList.add('sel');mood('A','happy');react('A','jump');await sleep(700);
    S.swapDone=true;finish({s:'A 決定保留 Gift 02，最終交換權就此用掉。'});return;
  }
  bs.find(b=>b.textContent.endsWith(t)).classList.add('sel');
  const gA=giftOf('A'),gT=giftOf(t),a=slotC('A'),b=slotC(t);
  mood('A','excited');
  await Promise.all([fly(gEl(gA),b,950,130),fly(gEl(gT),a,950,50)]);
  S.owner[gA]=t;S.owner[gT]='A';S.swapDone=true;renderGift(gA);renderGift(gT);
  shout('SWAPPED!',{x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-90});
  mood('A','happy');react('A','jump');
  mood(t,t==='C'?'confused':'sly');react(t,'shake');
  await sleep(1000);
  finish({s:`A 與 ${t} 交換了禮物！最終交換只能用一次。`});
}
async function runEnd(){
  busy=true;sync();IDS.forEach(p=>cls(p,'active',false));
  const h=$('#capT');h.classList.remove('wr');
  h.innerHTML='<span class="endq" id="endq">THE END?<svg viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M2 26 Q50 8 100 22 T198 14"/></svg></span>';
  setCap({s:''});
  await sleep(1300);$('#endq').classList.add('cut');await sleep(1100);
  h.innerHTML='<span class="hl">TIME TO UNWRAP!</span>';h.classList.add('wr');
  button('一起拆禮物！',unwrap,'y pulse').dataset.lock='';
  busy=false;sync();
}
async function unwrap(){
  busy=true;$('#acts').innerHTML='';sync();
  const FIN={A:'excited',B:'smug',C:'confused',D:'wry',E:'happy'};
  for(const p of IDS){
    const g=giftOf(p),el=gEl(g);el.classList.add('open');burst(el._p);
    mood(p,FIN[p]);react(p,'jump');await sleep(700);
  }
  S.unwrapped=true;await sleep(300);
  const h=$('#capT');h.classList.remove('wr');void h.offsetWidth;h.innerHTML='<span class="hl">聖誕零元購，交換成功！</span>';h.classList.add('wr');
  setCap({s:'最後～被票選為最爛禮物有小驚喜喔(´∀` )'});
  button('PLAY AGAIN ↗',()=>{snaps.length=0;enter(0,initial())},'y');
  busy=false;done=true;sync();
}

/* ---------- wiring ---------- */
$$('.gift').forEach(el=>el.addEventListener('click',()=>{
  if(busy||done)return;const d=SCN[N],g=+el.dataset.g;
  if(d.k==='pick'&&d.g===g)doPick(d);else if(d.k==='steal'&&d.g===g)doSteal(d);
}));
$('#next').addEventListener('click',()=>{if(done&&!busy&&N<10)enter(N+1,S)});
$('#prev').addEventListener('click',()=>{if(!busy&&N>0)enter(N-1,snaps[N-1])});
$('#restart').addEventListener('click',()=>{if(!busy){snaps.length=0;enter(0,initial())}});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'&&!$('#next').disabled)$('#next').click();
  if(e.key==='ArrowLeft'&&!$('#prev').disabled)$('#prev').click();
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!busy)layoutGifts()},80)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!busy)layoutGifts()});
enter(0,initial());
</script>

</body></html>
